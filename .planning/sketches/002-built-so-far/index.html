<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 002 · What's built so far</title>
<link rel="stylesheet" href="../themes/pane-dark.css">
<link rel="stylesheet" href="../shared/pane.css">
<style>
  /* A: board */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .col { background: var(--color-bg); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow: auto; }
  .col h3 { margin: 2px 4px 4px; font-size: var(--text-sm); display: flex; justify-content: space-between; }
  .col h3 span { color: var(--color-text-muted); font-weight: 500; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 9px 10px; cursor: pointer; transition: all .15s ease; }
  .card:hover { border-color: var(--color-border-strong); }
  .card .t { font-size: var(--text-sm); }
  .card .m { margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card.now { border-color: var(--color-primary); background: var(--color-primary-soft); }
  .card.retry { border-color: var(--color-warning); }
  .card.stuck { border-color: var(--color-warning); background: var(--color-warning-soft); }
  .card.done .t { color: var(--color-text-muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter { border: 1px solid var(--color-border); background: transparent; border-radius: var(--radius-full); padding: 4px 10px; font-size: var(--text-xs); cursor: pointer; transition: all .15s ease; display: inline-flex; gap: 6px; align-items: center; }
  .filter:hover { border-color: var(--color-border-strong); }
  .filter.on { border-color: var(--color-text); }
  .pdots { display: inline-flex; gap: 3px; }
  .pdots i { width: 14px; height: 4px; border-radius: 2px; background: var(--color-border-strong); }
  .pdots i.d { background: var(--color-success); }
  .pdots i.n { background: var(--color-primary); }

  /* B: areas */
  .areas { display: flex; flex-direction: column; gap: 8px; }
  .area { border: 1px solid var(--color-border); border-radius: var(--radius-md); transition: all .15s ease; }
  .area:hover { border-color: var(--color-border-strong); }
  .area-row { display: grid; grid-template-columns: 1fr 200px 120px; gap: 16px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .area-row .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .area-row .bl { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }
  .area-row .st { font-size: var(--text-xs); text-align: right; }
  .area-items { display: none; padding: 0 14px 12px 30px; }
  .area.open .area-items { display: block; }
  .area-items .it { display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; padding: 5px 0; border-top: 1px solid var(--color-border); font-size: var(--text-sm); align-items: start; }
  .area-items .it:first-child { border-top: 0; }
  .chev { color: var(--color-text-muted); transition: transform .15s ease; display: inline-block; }
  .area.open .chev { transform: rotate(90deg); }

  /* C: works today */
  .cap-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
  .cap h4 { margin: 0 0 6px; font-size: var(--text-sm); display: flex; gap: 8px; align-items: center; }
  .cap h4 span { color: var(--color-text-muted); font-weight: 500; }
  .cap ul { list-style: none; margin: 0; padding: 0; }
  .cap li { padding: 3px 0; font-size: var(--text-sm); display: flex; gap: 8px; }
  .cap li .ok { color: var(--color-success); }
  .strip { display: flex; flex-direction: column; gap: 8px; }
  .strip .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius-md); background: var(--color-primary-soft); }
  .strip .row.warn { background: var(--color-warning-soft); }
  .later { border-top: 1px solid var(--color-border); padding-top: 12px; }
  .later-list { display: none; margin-top: 8px; columns: 2; column-gap: 24px; }
  .later.open .later-list { display: block; }
  .later-list div { font-size: var(--text-sm); color: var(--color-text-muted); padding: 2px 0; break-inside: avoid; }

  @media (max-width: 760px) {
    .board, .cap-grid { grid-template-columns: 1fr; }
    .area-row { grid-template-columns: 1fr; gap: 6px; }
    .area-row .st { text-align: left; }
    .later-list { columns: 1; }
  }
</style>
</head>
<body>

<div id="variant-nav">
  <div class="row"><span class="label">Layout</span><span class="tabs row"></span><a href="../003-doing-now/index.html">Sketch 003: what it's doing now →</a></div>
  <div class="row"><span class="label">Loop state</span>
    <button class="state-btn" data-m="run">On track</button>
    <button class="state-btn" data-m="stuck">Something is stuck</button>
    <button class="state-btn" data-m="done">Finished</button>
  </div>
</div>

<p class="variant-desc" id="desc"></p>
<div class="pane">
  <div class="pane-title">Autoloop status <span>⤢ ✕</span></div>
  <div class="pane-body" id="main"></div>
</div>

<div id="toast" class="toast"></div>
<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.75);color:white;padding:8px 12px;border-radius:8px;opacity:0.45;transition:opacity 0.2s;display:flex;gap:8px;align-items:center" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.45'">
  <select id="theme-switcher" style="font-size:12px"><option value="pane-dark">Pane dark</option><option value="pane-light">Pane light</option></select>
  <button data-w="375" class="vp">Phone</button><button data-w="768" class="vp">Tablet</button><button data-w="0" class="vp">Full</button>
</div>

<script src="../shared/loop-data.js"></script>
<script src="../shared/chrome.js"></script>
<script>
const A = window.area;
const areaChip = key => `<span class="chip"><span class="dot" style="background:${A(key).color}"></span>${A(key).name}</span>`;
const tech = i => `<div class="tech">${i.id}${i.spec ? ' · ' + i.spec : ' · full technical spec from feature_list.json'}</div>`;
const pdots = i => `<span class="pdots">${LOOP.phases.map((_, n) => `<i class="${n < i.phase ? 'd' : n === i.phase ? 'n' : ''}"></i>`).join('')}</span>`;
const header = (L, mode) => `<div class="head"><h2>${L.name}</h2><div class="sub">${L.plain}</div>${verdict(L, mode)}</div>`;
let filterArea = null;

function itemNote(i) {
  if (i.state === 'now') return `<span class="xs" style="color:var(--color-primary)">${LOOP.phases[i.phase]}</span>${pdots(i)}`;
  if (i.state === 'retry') return `<span class="xs" style="color:var(--color-warning)">↻ Didn't pass yet · trying again (${i.tries} of ${i.maxTries} tries)</span>`;
  if (i.state === 'stuck') return `<span class="xs" style="color:var(--color-warning)">⚠ Failed 3 times · needs you</span>`;
  if (i.state === 'waiting') return `<span class="xs muted">after ${i.after}</span>`;
  if (i.state === 'done') return `<span class="xs muted">✓ ${i.at}</span>`;
  return '';
}

// A: board
function board(L, mode) {
  const items = L.items.filter(i => !filterArea || i.area === filterArea);
  const cols = [
    ['Works now', items.filter(i => i.state === 'done').reverse()],
    ['Being built', items.filter(i => ['now', 'retry', 'stuck'].includes(i.state))],
    ['Coming up', items.filter(i => i.state === 'next' || i.state === 'waiting')],
  ];
  const filters = `<div class="filters"><button class="filter ${!filterArea ? 'on' : ''}" onclick="filterArea=null;redraw()">All areas</button>${L.areas.map(a => {
    const c = counts(L.items, a.key);
    return `<button class="filter ${filterArea === a.key ? 'on' : ''}" onclick="filterArea='${a.key}';redraw()"><span class="dot" style="background:${a.color}"></span>${a.name} <span class="muted">${c.done}/${c.total}</span></button>`;
  }).join('')}</div>`;
  return `${header(L, mode)}${filters}<div class="board">${cols.map(([t, xs]) => `<div class="col"><h3>${t} <span>${xs.length}</span></h3>${
    xs.length ? xs.map(i => `<div class="card ${i.state}" data-box data-toggle><div class="t">${i.plain}</div><div class="m">${areaChip(i.area)}${itemNote(i)}</div>${i.state === 'now' ? `<div class="xs muted" style="margin-top:6px">${i.doing}</div>` : ''}${tech(i)}</div>`).join('') : '<div class="xs muted" style="padding:4px">Nothing here</div>'
  }</div>`).join('')}</div><div class="xs muted">Click a card for the technical spec.</div>`;
}

// B: areas
function areas(L, mode) {
  const icon = i => ({ done: '<span style="color:var(--color-success)">✓</span>', now: '<span style="color:var(--color-primary)">◆</span>', retry: '<span style="color:var(--color-warning)">↻</span>', stuck: '<span style="color:var(--color-warning)">⚠</span>' })[i.state] || '<span class="muted">○</span>';
  const order = { stuck: 0, now: 1, retry: 1, done: 2, next: 3, waiting: 4 };
  return `${header(L, mode)}<div class="areas">${L.areas.map((a, n) => {
    const xs = L.items.filter(i => i.area === a.key).sort((x, y) => order[x.state] - order[y.state]);
    const c = counts(L.items, a.key);
    const building = xs.filter(i => i.state === 'now');
    const stuck = xs.find(i => i.state === 'stuck');
    const status = stuck ? `<span style="color:var(--color-warning)">⚠ 1 needs you</span>` : building.length ? `<span style="color:var(--color-primary)">◆ building ${building.length}</span>` : c.done === c.total ? `<span style="color:var(--color-success)">✓ all work</span>` : `<span class="muted">waiting its turn</span>`;
    const pct = v => (100 * v / c.total).toFixed(1) + '%';
    return `<div class="area ${n === 0 ? 'open' : ''}" data-box>
      <div class="area-row" data-toggle>
        <div><div class="nm"><span class="chev">›</span><span class="dot" style="background:${a.color}"></span>${a.name}</div><div class="bl">${a.blurb}</div></div>
        <div><div class="bar"><i style="width:${pct(c.done)}"></i><i class="now" style="width:${pct(c.now)}"></i><i class="stuck" style="width:${pct(c.stuck)}"></i></div><div class="xs muted" style="margin-top:4px">${c.done} of ${c.total} work</div></div>
        <div class="st">${status}</div>
      </div>
      <div class="area-items">${xs.map(i => `<div class="it" data-box><span>${icon(i)}</span><div>${i.plain}${i.state === 'now' ? `<div class="xs muted">${LOOP.phases[i.phase]}: ${i.doing.toLowerCase()}</div>` : ''}${i.state === 'retry' ? `<div class="xs" style="color:var(--color-warning)">Didn't pass yet: ${i.why} Trying again.</div>` : ''}${tech(i)}</div><span>${itemNote(i).replace(/<span class="pdots">.*<\/span>/, '')} <button class="link" data-toggle>details</button></span></div>`).join('')}</div>
    </div>`;
  }).join('')}</div>`;
}

// C: what works today
function works(L, mode) {
  const done = L.items.filter(i => i.state === 'done');
  const active = L.items.filter(i => ['now', 'retry', 'stuck'].includes(i.state));
  const ready = L.items.filter(i => i.state === 'next');
  const later = L.items.filter(i => i.state === 'next' || i.state === 'waiting').slice(3);
  const caps = L.areas.map(a => {
    const xs = done.filter(i => i.area === a.key);
    const c = counts(L.items, a.key);
    return xs.length ? `<div class="cap"><h4><span class="dot" style="background:${a.color}"></span>${a.name} <span>${c.done} of ${c.total}</span></h4><ul>${xs.map(i => `<li><span class="ok">✓</span>${i.plain}</li>`).join('')}</ul></div>` : '';
  }).join('');
  const strip = active.length ? `<div><div class="sec-title">Being built right now</div><div class="strip">${active.map(i => `<div class="row ${i.state !== 'now' ? 'warn' : ''}" data-box><span class="dot" style="background:${A(i.area).color}"></span><div style="flex:1"><b class="small">${i.plain}</b><div class="xs muted">${i.state === 'now' ? `${LOOP.phases[i.phase]} · ${i.minutes} min in, usually ~${i.usual} min` : i.state === 'retry' ? `Didn't pass yet, trying again (${i.tries} of ${i.maxTries})` : 'Failed 3 times. The loop moved on; it needs you to look.'}</div>${tech(i)}</div><button class="link" data-toggle>details</button></div>`).join('')}</div></div>` : '';
  const next = ready.length ? `<div><div class="sec-title">Next up</div>${ready.slice(0, 3).map(i => `<div class="small" style="padding:3px 0"><span class="dot" style="background:${A(i.area).color};margin-right:8px"></span>${i.plain}</div>`).join('')}</div>` : '';
  const laterBox = later.length ? `<div class="later" data-box><button class="link" data-toggle>And ${later.length} more after that</button><div class="later-list">${later.map(i => `<div>${i.plain}${i.after ? ` <span class="xs">(after ${i.after})</span>` : ''}</div>`).join('')}</div></div>` : '';
  return `${header(L, mode)}<div><div class="sec-title">${mode === 'done' ? 'Your app can now' : 'Your app can already'}</div><div class="cap-grid">${caps}</div></div>${strip}${next}${laterBox}`;
}

Sketch({
  variants: [
    { key: 'a', label: 'A: Board', desc: '<b>A: Board.</b> Three columns like Trello or Linear: what works, what is being built, what comes next. Each card is one plain sentence with its area. Filter by area at the top; click a card for the technical spec.' },
    { key: 'b', label: 'B: Areas ★ Selected', desc: '<b>B: Areas.</b> One row per feature area with its own progress, closest to how you think about the product ("how far is Accounts?"). Open an area to see its items, newest activity first.' },
    { key: 'c', label: 'C: What works today', desc: '<b>C: What works today.</b> Reads like release notes: a checklist of what your app can already do, grouped by area, then a short "being built right now" and "next up". Everything still to come stays folded.' },
  ],
  render: (v, L, mode) => loopsColumn(L, mode) + `<div class="main">${v === 'a' ? board(L, mode) : v === 'b' ? areas(L, mode) : works(L, mode)}</div>`,
});
</script>
</body>
</html>
