<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001 · Telegram message format</title>
<style>
  /* themes inlined so the page works opened straight from disk; ../themes/*.css hold the same values */
  :root {
    --color-bg: #eef1f4; --color-chat: #c7d8b8; --color-surface: #ffffff; --color-border: #dfe3e8;
    --color-text: #111b21; --color-text-muted: #707579; --color-primary: #3390ec; --color-primary-hover: #2a7fd4;
    --color-accent: #e8a43a; --color-danger: #e53935; --color-success: #4fae4e; --color-quote: #3390ec; --color-code-bg: #eef2f6; --color-code-text: #c2185b;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
    --text-xs: 0.72rem; --text-sm: 0.875rem; --text-base: 0.95rem; --text-lg: 1.1rem;
    --radius-sm: 4px; --radius-md: 12px; --radius-lg: 18px; --radius-full: 9999px;
    --shadow-sm: 0 1px 1px rgba(0, 0, 0, 0.12); --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.18);
  }
  :root[data-theme="midnight"] {
    --color-bg: #0e1621; --color-chat: #17212b; --color-surface: #182533; --color-border: #22303f;
    --color-text: #f5f5f5; --color-text-muted: #7f91a4; --color-primary: #5eb5f7; --color-primary-hover: #7cc3f8;
    --color-accent: #f0b35a; --color-danger: #ff6b6b; --color-success: #6fcf6b; --color-quote: #5eb5f7; --color-code-bg: #22303f; --color-code-text: #f48fb1;
    --shadow-sm: 0 1px 1px rgba(0, 0, 0, 0.4); --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.5);
  }
</style>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 64px 16px 48px; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); transition: background .2s ease, color .2s ease; }
  #variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 9998; display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .variant-tab { font: 600 13px var(--font-sans); padding: 7px 12px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: transparent; color: var(--color-text); cursor: pointer; transition: all .15s ease; }
  .variant-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .variant-tab.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
  .notes { max-width: 360px; font-size: var(--text-sm); line-height: 1.55; color: var(--color-text-muted); }
  .notes h2 { margin: 0 0 6px; font-size: var(--text-lg); color: var(--color-text); }
  .notes b { color: var(--color-text); }
  .notes ul { padding-left: 18px; margin: 8px 0; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); background: var(--color-code-bg); color: var(--color-text); margin-right: 4px; }

  /* phone */
  .phone { width: 375px; max-width: 100%; height: 760px; border-radius: 44px; background: #000; padding: 12px; box-shadow: var(--shadow-lg); flex-shrink: 0; }
  .screen { position: relative; height: 100%; border-radius: 34px; overflow: hidden; background: var(--color-chat); display: flex; flex-direction: column; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 34px 14px 10px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #f6a04d, #e85d75); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .chat-head .name { font-weight: 700; font-size: 15px; }
  .chat-head .sub { font-size: 12px; color: var(--color-text-muted); }
  .feed { flex: 1; overflow-y: auto; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
  .day { align-self: center; font-size: 12px; font-weight: 600; color: #fff; background: rgba(0,0,0,.25); padding: 3px 10px; border-radius: var(--radius-full); }

  /* bubble: renders the Telegram HTML subset the bot would send */
  .bubble { position: relative; align-self: flex-start; max-width: 88%; background: var(--color-surface); border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px; padding: 7px 10px 18px; box-shadow: var(--shadow-sm); font-size: var(--text-base); line-height: 1.38; white-space: pre-wrap; word-wrap: break-word; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, opacity .25s ease; }
  .bubble:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.15); }
  .bubble.selected { outline: 2px solid var(--color-primary); }
  .bubble.enter { opacity: 0; transform: translateY(8px); }
  .bubble .time { position: absolute; right: 9px; bottom: 4px; font-size: 11px; color: var(--color-text-muted); }
  .bubble b { font-weight: 700; }
  .bubble i { font-style: italic; }
  .bubble code { font-family: var(--font-mono); font-size: .86em; color: var(--color-code-text, #c2185b); background: var(--color-code-bg); padding: 1px 4px; border-radius: var(--radius-sm); }
  .bubble blockquote { margin: 6px 0 0; padding: 4px 8px 4px 10px; border-left: 3px solid var(--color-quote); background: color-mix(in srgb, var(--color-quote) 10%, transparent); border-radius: 0 6px 6px 0; font-size: .92em; }
  .bubble blockquote.expandable { position: relative; max-height: 1.45em; overflow: hidden; padding-right: 26px; transition: max-height .25s ease; }
  .bubble blockquote.expandable::after { content: "⌄"; position: absolute; right: 8px; top: 2px; color: var(--color-quote); font-weight: 700; }
  .bubble blockquote.expandable.open { max-height: 12em; }
  .bubble blockquote.expandable.open::after { content: "⌃"; }
  .muted { color: var(--color-text-muted); }

  /* lock-screen preview: what a glance shows before opening the chat */
  .lock { position: absolute; left: 10px; right: 10px; top: 40px; z-index: 5; background: rgba(245,245,247,.92); color: #111; backdrop-filter: blur(12px); border-radius: 18px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; line-height: 1.32; transform: translateY(calc(-100% - 60px)); transition: transform .3s ease; }
  .lock.show { transform: none; }
  .lock .top { display: flex; justify-content: space-between; font-size: 11px; color: #6b6b6b; margin-bottom: 2px; }
  .lock .title { font-weight: 700; }
  .lock .body { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .actions { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .btn { font: 600 13px var(--font-sans); padding: 7px 12px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); cursor: pointer; transition: all .15s ease; }
  .btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
  pre.raw { white-space: pre-wrap; font: 12px/1.45 var(--font-mono); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 10px; max-height: 260px; overflow: auto; color: var(--color-text); display: none; }
  pre.raw.show { display: block; }
</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" data-v="e1">E1: Quote block</button>
  <button class="variant-tab" data-v="e2">E2: Quote + code ★ Selected</button>
  <button class="variant-tab" data-v="e3">E3: Quote + code + bar</button>
  <button class="variant-tab" data-v="e">E: Briefing list</button>
  <button class="variant-tab" data-v="f">F: Briefing line (synthesis)</button>
  <button class="variant-tab" data-v="a">A: Executive headline</button>
  <button class="variant-tab" data-v="b">B: Status card</button>
  <button class="variant-tab" data-v="c">C: Headline + fold</button>
  <button class="variant-tab" data-v="d">D: Quiet mode</button>
</div>

<div class="stage">
  <div class="phone"><div class="screen">
    <div class="lock" id="lock"><div class="top"><span>LoopBot</span><span>now</span></div><div class="title" id="lock-title"></div><div class="body" id="lock-body"></div></div>
    <div class="chat-head"><div class="avatar">L</div><div><div class="name">LoopBot</div><div class="sub">bot</div></div></div>
    <div class="feed" id="feed"></div>
  </div></div>

  <div class="notes">
    <h2 id="v-title"></h2>
    <div id="v-desc"></div>
    <div class="actions">
      <button class="btn" id="replay">▶ Replay messages</button>
      <button class="btn" id="raw-toggle">Show what the bot sends</button>
    </div>
    <p class="muted" style="font-size:12px;margin:0 0 8px">Click a message to see its lock-screen preview. In C, tap the quote to fold it open.</p>
    <pre class="raw" id="raw"></pre>
  </div>
</div>

<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.75);color:white;padding:8px 12px;border-radius:8px;opacity:0.45;transition:opacity 0.2s;display:flex;gap:8px;align-items:center" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.45'">
  <select id="theme-switcher" style="font-size:12px">
    <option value="default">Telegram light</option>
    <option value="midnight">Telegram dark</option>
  </select>
  <button data-w="375" class="vp">Phone</button>
  <button data-w="768" class="vp">Tablet</button>
  <button data-w="0" class="vp">Full</button>
</div>

<script>

  },
  e3: {
    title: "E3: Quote + code + bar",
    desc: "<p>E2, plus a ten-cell text progress bar (plain \u25b0\u25b1 characters, not emojis) under the project name.</p><ul><li><b>For:</b> progress is readable without doing the maths.</li><li><b>Against:</b> one more line; the lock screen shows the bar, not the event.</li></ul><p><span class=\"pill\">quote tint</span><span class=\"pill\">code tint</span><span class=\"pill\">progress bar</span></p>",

  e: {
    title: 'E: Briefing list',
    desc: '<p>No emojis. Bold project and progress, the event in one italic line, then the same four lines every time: what runs <b>now</b>, what runs <b>next</b>, what is still <b>pending</b>, and when it should <b>finish</b>.</p><ul><li><b>For:</b> a fixed shape you learn once, and every message answers "where are we and when is it done".</li><li><b>Against:</b> five or six lines, so the lock screen shows the headline and the first two.</li></ul><p><span class="pill">no emojis</span><span class="pill">Now · Next · Pending · Finish</span></p>',

      ['21:02', '<b>shop-web · Invoice reminders</b> · 0/19\n<i>Loop started.</i>\n• <b>Now:</b> F1 export button\n• <b>Next:</b> F2 CSV download\n• <b>Pending:</b> 19 items\n• <b>Finish:</b> ~00:15, in 3h 13m'],

const $ = id => document.getElementById(id);
let current = 'e1', timers = [];

// What notify.sh would send: Telegram HTML (parse_mode=HTML) with only b, i, code and blockquote expandable.
const toTelegram = html => html.replace(/<blockquote class="expandable">/g, '<blockquote expandable>');
const plain = html => html.replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

function bubble([time, html], animate) {
  const el = document.createElement('div');
  el.className = 'bubble' + (animate ? ' enter' : '');
  el.innerHTML = html + `<span class="time">${time}</span>`;
  el.addEventListener('click', e => {
    const q = e.target.closest('blockquote.expandable');
    if (q) { q.classList.toggle('open'); return; }
    document.querySelectorAll('.bubble').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    preview(html);
  });
  return el;
}

function preview(html) {
  const lines = plain(html).split('\n');
  $('lock-title').textContent = lines[0];
  $('lock-body').textContent = lines.slice(1).join(' ');
  const lock = $('lock');
  lock.classList.add('show');
  clearTimeout(preview.t);
  preview.t = setTimeout(() => lock.classList.remove('show'), 3200);
}

function render(v, animate) {
  timers.forEach(clearTimeout); timers = [];
  const feed = $('feed');
  feed.innerHTML = '<div class="day">Tonight</div>';
  $('v-title').textContent = V[v].title;
  $('v-desc').innerHTML = V[v].desc;
  $('raw').textContent = V[v].msgs.map(([t, h]) => `--- ${t}\n${toTelegram(h)}`).join('\n\n');
  V[v].msgs.forEach((m, i) => {
    const add = () => {
      const el = bubble(m, animate);
      feed.appendChild(el);
      if (animate) { requestAnimationFrame(() => el.classList.remove('enter')); preview(m[1]); }
      feed.scrollTop = feed.scrollHeight;
    };
    animate ? timers.push(setTimeout(add, i * 900)) : add();
  });
}

document.querySelectorAll('.variant-tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  current = tab.dataset.v;
  render(current, false);
}));
$('replay').addEventListener('click', () => render(current, true));
$('raw-toggle').addEventListener('click', e => {
  const shown = $('raw').classList.toggle('show');
  e.target.textContent = shown ? 'Hide what the bot sends' : 'Show what the bot sends';
});
$('theme-switcher').addEventListener('change', e => {
  document.documentElement.dataset.theme = e.target.value;
  document.querySelector('link[href*=themes]').href = '../themes/' + e.target.value + '.css';
});
document.querySelectorAll('.vp').forEach(b => b.addEventListener('click', () => {
  const w = +b.dataset.w;
  document.querySelector('.stage').style.maxWidth = w ? w + 'px' : '1100px';
}));

render('e1', false);
