<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autoloop Dashboard</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<a href="#main" class="skip">Skip to loop details</a>
<header class="row toolbar"><h1>Autoloop</h1><div class="row"><p id="connection" role="status">Connecting...</p><button id="refresh" type="button">Refresh</button><label><input id="live" type="checkbox" checked> Live (3s)</label></div></header>
<p id="error" role="alert" hidden></p>
<div id="source-errors"></div>
<details id="sources" class="source"><summary><strong>Sources</strong> <span id="source-count" class="muted"></span></summary>
<form id="source-form"><label for="path">Repository or loop directory</label><div class="row"><input id="path" name="path" placeholder="/absolute/path/to/repository" required><button>Add source</button></div></form>
<p class="muted">Reads only selected directories and their Git worktrees. Sources persist across sessions. Adding a path again shows loops you removed.</p>
<ul id="roots"></ul>
</details>
<div class="layout"><nav id="loops" aria-label="Loops"></nav><main id="main" tabindex="-1"><p>Add a source to see its loops.</p></main></div>
<dialog id="rename-dialog"><form id="rename-form"><h2>Rename loop</h2><label for="loop-name">Display name</label><input id="loop-name" maxlength="80" required><p id="rename-error" role="alert"></p><div class="row"><button>Save name</button><button type="button" id="cancel-rename">Cancel</button></div></form></dialog>
</body>
</html>
